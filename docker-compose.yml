version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: panelsync-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: panelsync
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panelsync-app
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/panelsync
      JWT_SECRET: panelsync_production_secret_key_jwt_2026
      JWT_EXPIRES_IN: 7d
      ENABLE_MOCK_CALENDARS: "true"
      EMAIL_FROM: "PanelSync Notifications <noreply@panelsync.io>"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local

