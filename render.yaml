services:
  - type: web
    name: panelsync
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set to your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENABLE_MOCK_CALENDARS
        value: "true"
      - key: EMAIL_FROM
        value: "PanelSync Notifications <noreply@panelsync.io>"

